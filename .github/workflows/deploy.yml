# انتشار خودکار نسخه‌ی استاتیک روی GitHub Pages.
#
# منبع Pages این ریپو شاخه‌ی gh-pages است، پس این workflow خروجی build را
# روی همان شاخه می‌گذارد. gh-pages فقط فایل‌های آماده‌ی سرو را دارد و کد منبع
# ندارد؛ هیچ‌وقت دستی رویش کامیت نکنید — با هر push روی main بازنویسی می‌شود.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # امکان اجرای دستی از تب Actions
  workflow_dispatch:

permissions:
  contents: write

# اگر چند انتشار هم‌زمان شد، نیمه‌کاره رها نشود
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: انتشار خروجی build روی شاخه‌ی gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # جلوی پردازش Jekyll را می‌گیرد تا فایل‌ها دست‌نخورده سرو شوند
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
